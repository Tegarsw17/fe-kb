# Static file server inside the web container (port 80, plain HTTP).
# Caddy in front terminates HTTPS and sends /api/* to the API container.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app uses #/hash URLs, so every request is just a static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built files have content hashes in their names → cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always fetch the newest index.html so updates show up right away.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;
    gzip_min_length 1024;
}
